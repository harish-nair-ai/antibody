[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antibody"
version = "0.1.0"
description = "Open failure-mode registry, vaccine package manager, and trace distiller for coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "pathspec>=0.12.0",
    "tomlkit>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.6.0"]

[project.scripts]
antibody = "antibody.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/antibody"]

[dependency-groups]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Antigen fixtures intentionally contain the bad code the vaccines detect.
extend-exclude = ["src/antibody/starter_registry/packs/*/*/evals/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
# Pack data (antigen fixtures + per-pack evals with duplicate module names), not package code.
exclude = ["src/antibody/starter_registry/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["antibody"]
